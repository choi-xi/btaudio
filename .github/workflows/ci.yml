name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build GUI
        run: dotnet build gui/btaudio-gui.csproj -c Release

      - name: Build CLI
        run: dotnet build cli/btaudio-cli.csproj -c Release
